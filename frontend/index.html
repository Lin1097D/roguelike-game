<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>肉鸽杀怪</title>
<link rel="stylesheet" href="css/style.css">
</head>
<body>
<div class="app">
  <h1>⚔️ 肉鸽杀怪</h1>

  <!-- 登录注册 -->
  <div id="authPanel" class="auth">
    <input id="username" placeholder="用户名" />
    <input id="password" type="password" placeholder="密码" />
    <button onclick="doRegister()">注册</button>
    <button onclick="doLogin()">登录</button>
    <div id="authMsg" class="center" style="color:#ff5773;font-size:13px;"></div>
  </div>

  <!-- 游戏主界面 -->
  <div id="gamePanel" class="hidden">

    <!-- 属性栏 -->
    <div class="stats">
      <div class="stat">攻击力: <span id="sAtk">1</span></div>
      <div class="stat">击杀: <span id="sKill">0</span></div>
      <div class="stat">金币: <span id="sGold">0</span></div>
      <div class="stat">灵魂: <span id="sSoul">0</span></div>
      <div class="stat">劫力: <span id="sJieli">0</span> 层</div>
      <div class="stat">自由点: <span id="sFreePoints">0</span></div>
      <div class="stat">吸血: <span id="sDrain">0%</span></div>
      <div class="stat">金币加成: <span id="sGoldBonus">0%</span></div>
    </div>

    <!-- 等级 + 经验条 -->
    <div class="title-sm">等级 <span id="lvText">Lv.1</span> · 经验 <span id="expText">0/100</span></div>
    <div class="bar exp-bar"><div id="expBar" style="width:0%"></div></div>

    <!-- 血条 -->
    <div class="title-sm">血量 <span id="hpText">100/100</span></div>
    <div class="bar hp-bar"><div id="hpBar" style="width:100%"></div></div>

    <!-- 蓝条 -->
    <div class="title-sm">精神力 <span id="mpText">50/50</span></div>
    <div class="bar mp-bar"><div id="mpBar" style="width:100%"></div></div>

    <!-- 子标签栏（顶部） -->
    <div class="subtabs" id="subTabs"></div>

    <!-- 内容区 -->
    <div class="tab-content">

      <!-- ============ 战斗 ============ -->
      <div class="tab-pane active" id="tab-battle">
        <div id="monsterBox" class="monster normal">
          <div class="name" id="mName">史莱姆</div>
          <div class="title-sm">血量 <span id="mHpText">30/30</span></div>
          <div class="bar hp-bar"><div id="mHpBar" style="width:100%"></div></div>
          <div class="title-sm">攻击 <span id="mAtk">3</span></div>
        </div>

        <div class="log" id="log"></div>

        <div class="actions">
          <button class="btn" onclick="autoFight()" id="btnAuto">自动战斗</button>
          <button class="btn" onclick="useSkill('heavy')">重击(8)</button>
          <button class="btn" onclick="useSkill('heal')">治疗(10)</button>
          <button class="btn" onclick="useSkill('drain')">吸血(12)</button>
          <button class="btn" onclick="useSkill('rage')">狂暴(15)</button>
          <button class="btn" onclick="logout()">退出</button>
        </div>

        <div style="text-align:center;margin-top:8px;">
          <button class="btn" onclick="toggleSpeed()" id="btnSpeed" style="padding:4px 12px;font-size:12px;">速度 x1</button>
        </div>
      </div>

      <!-- ============ 背包 ============ -->
      <div class="tab-pane" id="tab-bag">
        <div class="equipment-panel">
          <div class="equipment-title">
            🗡️ 装备栏
            <span onclick="onAutoEquip()" style="float:right;cursor:pointer;color:#8a6a2a;font-size:12px;margin-left:8px;">[自动装备]</span>
          </div>
          <div class="equipment-grid">
            <div class="eq-slot empty" id="eq-weapon">武器：空</div>
            <div class="eq-slot empty" id="eq-armor">护甲：空</div>
            <div class="eq-slot empty" id="eq-ring">戒指：空</div>
            <div class="eq-slot empty" id="eq-necklace">项链：空</div>
            <div class="eq-slot empty" id="eq-artifact1">神器·上：空</div>
            <div class="eq-slot empty" id="eq-artifact2">神器·下：空</div>
          </div>
        </div>

        <div class="bag-panel">
          <div class="equipment-title">🎒 背包（每槽位最多 10 件）</div>
          <div class="bag-list" id="bagList"></div>
        </div>
      </div>

      <!-- ============ 天赋 ============ -->
      <div class="tab-pane" id="tab-talent">
        <div class="talent-panel">
          <div class="equipment-title">
            ✨ 天赋
            <span onclick="onDrawTalent()" style="float:right;cursor:pointer;color:#8a6a2a;font-size:12px;">[抽取 (1000金币)]</span>
          </div>
          <div id="talentList" class="talent-list"></div>
        </div>
      </div>

      <!-- ============ 技能 ============ -->
      <div class="tab-pane" id="tab-skill">
        <div class="equipment-title">🌟 技能树</div>
        <div id="skillHeader"></div>
        <div id="skillList" class="skill-list"></div>
      </div>

      <!-- ============ 排行 ============ -->
      <div class="tab-pane" id="tab-rank">
        <div class="equipment-title">🏅 排行榜</div>
        <div id="rankTabs" class="rank-tabs"></div>
        <div id="rankList" class="rank-list"></div>
      </div>

      <!-- ============ BOSS ============ -->
      <div class="tab-pane" id="tab-boss">
        <div class="equipment-title">👹 BOSS 挑战</div>
        <div id="bossHeader"></div>
        <div id="bossList" class="boss-list"></div>
      </div>

      <!-- ============ 图鉴 ============ -->
      <div class="tab-pane" id="tab-monster">
        <div class="equipment-title">📖 怪物图鉴</div>
        <div id="monsterList" class="monster-list"></div>
      </div>

      <!-- ============ 商店 ============ -->
      <div class="tab-pane" id="tab-shop">
        <div class="equipment-title">🛒 商店</div>
        <div id="shopList" class="shop-list"></div>
      </div>

      <!-- ============ 每日任务 ============ -->
      <div class="tab-pane" id="tab-daily">
        <div class="equipment-title">📅 每日任务</div>
        <div id="dailyList" class="daily-list"></div>
        <div style="margin-top:12px;text-align:center;">
          <button class="btn" onclick="onRebirth()" style="padding:8px 16px;">🔄 转生（需 100 级）</button>
        </div>
      </div>

      <!-- ============ 签到 ============ -->
      <div class="tab-pane" id="tab-signin">
        <div class="equipment-title">📆 每日签到</div>
        <div id="signinList" class="signin-list"></div>
        <div style="text-align:center;margin-top:12px;">
          <button class="btn" onclick="onSignin()" id="btnSignin" style="padding:8px 24px;">签到</button>
        </div>
      </div>

      <!-- ============ 成就 ============ -->
      <div class="tab-pane" id="tab-achievement">
        <div class="equipment-title">🏆 成就</div>
        <div id="achievementList" class="achievement-list"></div>
      </div>

      <!-- ============ 统计 ============ -->
      <div class="tab-pane" id="tab-stats">
        <div class="equipment-title">📊 数据统计</div>
        <div id="statsList" class="stats-list"></div>
      </div>

      <!-- ============ 设置 ============ -->
      <div class="tab-pane" id="tab-settings">
        <div class="equipment-title">⚙️ 设置</div>
        <div id="settingsList" class="settings-list"></div>
      </div>

    </div>

    <!-- 底部主标签栏 -->
    <div class="bottom-nav">
      <div class="nav-item active" data-main="battle" onclick="switchMainTab('battle')">
        <div class="nav-icon">⚔️</div>
        <div class="nav-label">战斗</div>
      </div>
      <div class="nav-item" data-main="grow" onclick="switchMainTab('grow')">
        <div class="nav-icon">🎒</div>
        <div class="nav-label">养成</div>
      </div>
      <div class="nav-item" data-main="social" onclick="switchMainTab('social')">
        <div class="nav-icon">🏆</div>
        <div class="nav-label">社交</div>
      </div>
      <div class="nav-item" data-main="shop" onclick="switchMainTab('shop')">
        <div class="nav-icon">🛒</div>
        <div class="nav-label">商店</div>
      </div>
      <div class="nav-item" data-main="more" onclick="switchMainTab('more')">
        <div class="nav-icon">⚙️</div>
        <div class="nav-label">更多</div>
      </div>
    </div>

  </div>
</div>

<script src="js/config.js"></script>
<script src="js/api.js"></script>
<script src="js/ui.js"></script>
<script src="js/equipment.js"></script>
<script src="js/talent.js"></script>
<script src="js/shop.js"></script>
<script src="js/achievement.js"></script>
<script src="js/daily.js"></script>
<script src="js/signin.js"></script>
<script src="js/rank.js"></script>
<script src="js/stats.js"></script>
<script src="js/monster.js"></script>
<script src="js/boss.js"></script>
<script src="js/skill.js"></script>
<script src="js/settings.js"></script>
<script src="js/battle.js"></script>
<script src="js/main.js"></script>
</body>
</html>
